plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.personal.ntfylistener'
version = '1.0.0'

android {
  namespace "dev.personal.ntfylistener"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // React Native이 이미 앱에 넣어 두는 버전과 같게 맞춘다
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
}
